# Static server for the built dashboard, inside the compose network.
#
# Routing of /api and /ws is the edge nginx service's job, not this one's: a request that
# reaches here is for the app shell or an asset.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed filenames, so an asset at a given URL never changes. Cache it hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html is NOT cached. It names the hashed bundles, so a stale copy would point a
    # browser at assets that no longer exist after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # React Router owns the paths. /safety is not a file, so anything that is not an asset
    # falls back to the shell and the router resolves it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Mistyped API calls must not be answered with the SPA shell and a 200 - the same trap
    # that made /health look permanently healthy in phase 4. Fail loudly instead.
    location /api/ {
        return 404;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
