# CylinGuard edge proxy.
#
# The only container published to the host. Everything else talks over the compose network,
# so the browser sees one origin and the app can use relative paths - which is why the same
# build works behind Vite's dev proxy and behind this.
#
#   /        -> frontend:80    the built React app
#   /api/    -> backend:8000   REST
#   /ws/     -> backend:8000   WebSocket, with the upgrade handshake
#   /health  -> backend:8000   liveness, including the database

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # Compress text; never images or the already-gzipped. `gzip_vary` so a shared cache does
    # not hand a compressed body to a client that cannot read it.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml;

    # Do not advertise the exact nginx version to every caller.
    server_tokens off;

    # A WebSocket handshake sends `Connection: Upgrade`; an ordinary request does not. Mapping
    # it means one proxy block can serve both without closing live sockets - hardcoding
    # `Connection: upgrade` on a plain request breaks keepalive, and hardcoding `close` kills
    # the WebSocket.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream cylinguard_backend {
        server backend:8000;
        keepalive 32;
    }

    upstream cylinguard_frontend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;

        # An ESP32 packet is a few hundred bytes. A megabyte is generous and still refuses a
        # body large enough to be an attack.
        client_max_body_size 1m;

        # Clickjacking and MIME-sniffing, both cheap to prevent. No HSTS: this stack serves
        # plain HTTP, and sending HSTS over HTTP would be wrong.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # --- REST ---
        location /api/ {
            proxy_pass http://cylinguard_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
        }

        # --- WebSocket ---
        # Separate block because the timeouts are different, not because the headers are: a
        # dashboard socket is idle between readings, and the 60s read timeout above would
        # disconnect it every minute. 1h, with the client's own ping as the keepalive.
        location /ws/ {
            proxy_pass http://cylinguard_backend;
            proxy_http_version 1.1;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;

            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            # Buffering would hold frames back waiting for a full buffer, which defeats the
            # point of a live dashboard.
            proxy_buffering off;
        }

        # --- health ---
        # Explicit, because /health sits outside /api and would otherwise fall through to the
        # SPA and answer 200 with index.html - a health check that can never fail, which is
        # exactly the bug phase 4 hit locally.
        location = /health {
            proxy_pass http://cylinguard_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        # --- the app ---
        location / {
            proxy_pass http://cylinguard_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        access_log /var/log/nginx/access.log;
        error_log  /var/log/nginx/error.log warn;
    }
}
